<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>KTP - Kidney Transplant Patient Tracker</title>
    <meta
      name="description"
      content="Patient registry, laboratory tracking, claims tracking, and appointment scheduling for kidney transplant recipients and donors." />
    <meta name="author" content="Organ Transplant Services" />
    <meta name="theme-color" content="#e2e5d5" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Fonts: Gabarito (display), Atkinson Hyperlegible Next (body), Atkinson Hyperlegible Mono (data). One variable file each. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..600&family=Atkinson+Hyperlegible+Next:wght@400..700&family=Gabarito:wght@600..800&display=swap" />

    <!-- Favicon and App Manifest -->
    <link rel="icon" type="image/png" href="/branding/ots-mark.png" />
    <link rel="apple-touch-icon" href="/branding/ots-mark.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KTP - Kidney Transplant Patient Tracker" />
    <meta property="og:description" content="Patient registry, laboratory tracking, claims tracking, and appointment scheduling for kidney transplant recipients and donors." />
    <meta property="og:image" content="/branding/ots-logo.png" />
    <meta property="og:site_name" content="KTP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KTP - Kidney Transplant Patient Tracker" />
    <meta name="twitter:description" content="Patient registry, laboratory tracking, claims tracking, and appointment scheduling for kidney transplant recipients and donors." />
    <meta name="twitter:image" content="/branding/ots-logo.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "KTP",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "All",
      "description": "Patient registry and laboratory tracking for kidney transplant recipients and donors.",
      "provider": {
        "@type": "MedicalOrganization",
        "name": "Organ Transplant Services"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
