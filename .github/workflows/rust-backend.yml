name: Rust backend compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ktp_rust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUST_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/ktp_rust_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --manifest-path src/rust-backend/Cargo.toml --check
      - name: Check Rust
        run: cargo clippy --locked --manifest-path src/rust-backend/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust
        run: pnpm test:rust
      - name: Check TypeScript and adapter
        run: pnpm check && pnpm exec vitest run server/localAuth.test.ts server/rustBackend.test.ts server/rustPortal.test.ts server/oauth-state.test.ts server/patient-access.test.ts server/messages.test.ts
      - name: Test PostgreSQL and existing tRPC compatibility
        run: pnpm test:rust:integration
      - name: Build and verify local app
        run: pnpm build && pnpm test:local
